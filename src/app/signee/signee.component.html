<ng-container>
  <div class="text-center signee-logo-container">
    @if (logo) {
      <img
        class="img-fluid signee-logo"
        [src]="logo.fields.file.url"
        [alt]="logo.fields.title"
        />
    }
  </div>
  <div class="mt-3">
    @if (name) {
      <b>{{ name }}</b>
    }

    @if (listOfSigningNames) {
      <br />Gezeichnet von: {{ listOfSigningNames }}
    }

    @if (website) {
      <br />Website:
      <a [href]="website" target="_blank"> {{ website }}</a>
    }
  </div>
</ng-container>
